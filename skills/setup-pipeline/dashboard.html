<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Runs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%233656d0%27/%3E%3C/svg%3E">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --sunk: #eef0f4; --fg: #1b2130; --muted: #636c80; --line: #e1e4ea;
  --accent: #3656d0; --on-accent: #ffffff; --ok: #237a38; --bad: #c0262d; --warn: #9a5a00; --run: #1869b8;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1116; --panel: #161a21; --sunk: #1d222b; --fg: #e3e6ed; --muted: #8d95a8; --line: #272d38;
    --accent: #7f97ff; --on-accent: #0e1116; --ok: #57c96b; --bad: #ff6b6b; --warn: #f0b429; --run: #54a8f0; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---- header ---- */
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
header h1 { margin: 0; font-size: 15px; font-weight: 650; }
header .counts { color: var(--muted); font-size: 12px; }
header .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--bad); }

/* ---- layout: each pane scrolls on its own ---- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }
#detail { overflow-y: auto; overscroll-behavior: contain; padding: 20px 24px 32px; min-width: 0; }

/* ---- sidebar ---- */
.filters { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; }
.seg { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg[aria-pressed="true"] { background: var(--sunk); color: var(--fg); border-color: var(--muted); }
.proj { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px 4px;
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.run { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 16px 8px 13px;
  border-left: 3px solid transparent; cursor: pointer; }
.run:hover { background: var(--sunk); }
.run[aria-current="true"] { background: var(--sunk); border-left-color: var(--accent); }
.run .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.run .name { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-running { color: var(--run); } .s-done { color: var(--ok); } .s-failed, .s-stopped { color: var(--bad); }
.s-paused { color: var(--warn); } .s-pending, .s-skipped { color: var(--muted); }
.empty { color: var(--muted); padding: 32px 20px; text-align: center; font-size: 13px; }

/* ---- buttons ---- */
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); }
.btn:disabled { color: var(--muted); cursor: not-allowed; opacity: .7; }
.proj .btn { font-size: 11px; padding: 1px 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }

/* ---- detail ---- */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h2 { margin: 0; font-size: 18px; font-weight: 650; }
.where { margin-top: 2px; color: var(--muted); font: 12px/1.5 var(--mono); word-break: break-all; }
.task { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }
.task summary { cursor: pointer; list-style: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task[open] summary { display: block; -webkit-line-clamp: unset; }
.task summary::-webkit-details-marker { display: none; }
.note { margin-top: 8px; padding: 8px 12px; border-radius: var(--r); font-size: 13px; white-space: pre-wrap; border: 1px solid var(--line); background: var(--sunk); }
.note.s-done { color: var(--fg); border-left: 3px solid var(--ok); }
.note.s-failed, .note.s-stopped { color: var(--fg); border-left: 3px solid var(--bad); }
.note.s-paused { color: var(--fg); border-left: 3px solid var(--warn); }

.track { display: flex; margin: 22px 0 6px; }
.stage { flex: 1; text-align: center; position: relative; min-width: 0; }
.stage::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.stage:first-child::before { display: none; }
.stage.done::before, .stage.running::before, .stage.failed::before { background: var(--ok); }
.node { position: relative; width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--panel); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.stage.done .node { border-color: var(--ok); color: var(--ok); }
.stage.failed .node { border-color: var(--bad); color: var(--bad); }
.stage.running .node { border-color: var(--run); color: var(--run); animation: pulse 1.4s infinite; }
.stage.skipped .node { border-style: dashed; }
.stage .lbl { font-size: 12px; font-weight: 600; }
.stage .sm { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 16px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--run) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) { .stage.running .node { animation: none; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 18px 0 14px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); }
.bar { height: 5px; border-radius: 3px; background: var(--sunk); margin-top: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.hot > i { background: var(--warn); }
.acs { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
td.n { font-variant-numeric: tabular-nums; }
.crit { margin: 14px 0 0; padding: 10px 12px 10px 28px; border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: var(--r); background: var(--panel); font-size: 13px; }
.crit b { display: block; margin-left: -16px; margin-bottom: 4px; }
.sec { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.sec small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
td.detail { white-space: normal; overflow-wrap: anywhere; min-width: 220px; max-width: 560px; color: var(--muted); }
.adv { color: var(--muted); font-size: 11px; margin-left: 4px; }

/* ---- tabs: activity + files ---- */
.panel { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--sunk); flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 9px 10px; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: var(--muted); }
.tools select { font: inherit; font-size: 12px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.tools label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.tabs .path { margin-left: auto; padding-right: 8px; color: var(--muted); font-size: 12px; }
.pane { height: 420px; overflow: auto; overscroll-behavior: contain; }
pre.file { margin: 0; padding: 12px 14px; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
/* rendered markdown (plan.md, review.md) */
.md { padding: 14px 20px 20px; font-size: 14px; line-height: 1.6; max-width: 900px; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.3em 0 .5em; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 15px; } .md h4 { font-size: 14px; color: var(--muted); }
.md p, .md ul, .md ol, .md table, .md pre, .md blockquote { margin: 0 0 .8em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md li > input[type="checkbox"] { margin: 0 .5em 0 -1.3em; vertical-align: middle; accent-color: var(--accent); width: 14px; height: 14px; }
.md li:has(> input[type="checkbox"]) { list-style: none; }
.md a { color: var(--accent); }
.md code { font: 12.5px var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow: auto; }
.md pre code { background: none; padding: 0; font-size: 12px; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; white-space: normal; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg); }
.md th { background: var(--sunk); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md .verdict { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 6px; border: 1px solid currentColor; }
.muted-note { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---- plan review banner + full-screen reader/editor ---- */
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.banner { margin-top: 12px; display: flex; gap: 12px 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: var(--r); background: var(--panel); }
.banner p { margin: 2px 0 6px; color: var(--muted); font-size: 13px; }
.banner .st { font-size: 13px; }
.banner .st.bad { color: var(--bad); font-weight: 600; }
.doc-alert ul.lint { margin: 4px 0; padding-left: 20px; }
.doc-alert ul.lint li { margin: 2px 0; }
.lint-line { font: 11px var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 4px; padding: 0 5px; cursor: pointer; }
.banner details { margin-top: 6px; font-size: 12px; color: var(--muted); }
.banner details summary { cursor: pointer; }
.banner code, .doc-alert code { font: 12px var(--mono); background: var(--sunk); padding: 2px 6px; border-radius: 4px; user-select: all; word-break: break-all; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.s-resumed { color: var(--muted); }
.seg:disabled { opacity: .45; cursor: not-allowed; }
.seg-group { display: flex; gap: 4px; }

dialog#doc { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; overflow: hidden;
  background: var(--bg); color: var(--fg); }
dialog#doc::backdrop { background: rgba(0, 0, 0, .55); }
.doc { display: flex; flex-direction: column; height: 100%; }
.doc-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.doc-id { min-width: 0; flex: 1 1 260px; }
.doc-id h2 { margin: 0; font-size: 16px; }
#docSub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-actions { display: flex; align-items: center; gap: 8px; }
.doc-alert { padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line); background: var(--sunk); flex: none; }
.doc-alert.warn { border-left: 4px solid var(--warn); } .doc-alert.bad { border-left: 4px solid var(--bad); } .doc-alert.ok { border-left: 4px solid var(--ok); }
.doc-body { flex: 1; min-height: 0; display: flex; }
.doc-read { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 28px 20px 64px; }
.doc-md { font-size: var(--doc-fs, 16px); line-height: 1.7; }
.doc-read .doc-md { max-width: 78ch; margin: 0 auto; padding: 0; }
.doc-md h1 { font-size: 1.5em; } .doc-md h2 { font-size: 1.25em; } .doc-md h3 { font-size: 1.1em; }
.doc-md code, .doc-md pre code, .doc-md th, .doc-md td { font-size: .85em; }
.doc-edit { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.doc-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.doc-pane + .doc-pane { border-left: 1px solid var(--line); }
.doc-pane > .md { flex: 1; overflow: auto; padding: 16px 20px 40px; max-width: none; }
.doc-label { padding: 5px 16px; flex: none; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunk); border-bottom: 1px solid var(--line); }
#docText { flex: 1; width: 100%; min-height: 0; resize: none; border: 0; padding: 16px; font: 13px/1.65 var(--mono); tab-size: 2;
  background: var(--panel); color: var(--fg); }
#docText:focus-visible, .doc-read:focus-visible, .doc-diff:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.doc-diff { flex: 1; margin: 0; overflow: auto; padding: 16px 20px 40px; font: 13px/1.6 var(--mono); }
.dl { display: block; white-space: pre-wrap; word-break: break-word; padding: 0 8px; }
.dl-add { background: color-mix(in srgb, var(--ok) 18%, transparent); }
.dl-del { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.dl-hunk { color: var(--muted); margin-top: 10px; }
.doc-foot { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.doc-decide { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.doc-decide .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.doc-note { display: flex; flex-direction: column; gap: 6px; max-width: 760px; }
.doc-note label { font-size: 12px; color: var(--muted); }
.doc-note textarea { width: 100%; padding: 8px 10px; font: 13px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
.doc-note .btn { align-self: flex-start; }
@media (max-width: 900px) {
  .doc-edit { grid-template-columns: minmax(0, 1fr); }
  .doc-edit .doc-pane + .doc-pane { display: none; }
  .doc-read { padding: 20px 16px 48px; }
}
.ev { display: grid; grid-template-columns: 62px 58px minmax(0, 1fr); gap: 8px; padding: 3px 12px; border-bottom: 1px solid var(--line); font: 12px/1.5 var(--mono); }
.ev .t, .ev .st { color: var(--muted); }
.feed:empty::before { content: "No activity recorded yet."; display: block; padding: 32px; text-align: center; color: var(--muted); font: 13px system-ui, sans-serif; }
.ev .x { word-break: break-word; font-weight: 400; }
.ev.k-text .x { font-family: system-ui, sans-serif; color: var(--muted); }
.ev.k-log .x { color: var(--accent); }
.feed[data-step] .ev { display: none; }
.feed[data-step="plan"] .ev[data-step="plan"], .feed[data-step="build"] .ev[data-step="build"],
.feed[data-step="review"] .ev[data-step="review"], .feed[data-step="commit"] .ev[data-step="commit"],
.feed[data-step="gates"] .ev[data-step="gates"] { display: grid; }

@media (max-width: 760px) {
  body { display: block; height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  #list { max-height: 45vh; }
  #detail { padding: 16px; overflow: visible; }
  .ev { grid-template-columns: 54px minmax(0, 1fr); } .ev .st { display: none; }
  header .counts { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header>
  <h1>Pipeline Runs</h1>
  <span class="counts" id="counts"></span>
  <span class="live" role="status"><span class="dot" id="dot"></span><span id="live">connecting…</span></span>
</header>
<main>
  <aside aria-label="Runs">
    <div class="filters" role="group" aria-label="Filter runs">
      <button class="seg" data-filter="all" aria-pressed="true">All</button>
      <button class="seg" data-filter="running" aria-pressed="false">Running</button>
      <button class="seg" data-filter="problem" aria-pressed="false">Failed</button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="detail" aria-live="off"><div class="empty">No runs yet. Start one with <code>/setup-pipeline</code>.</div></section>
</main>
<dialog id="doc" aria-labelledby="docTitle">
  <div class="doc">
    <header class="doc-bar">
      <div class="doc-id"><h2 id="docTitle">plan.md</h2><span id="docSub" role="status"></span></div>
      <div class="seg-group" role="group" aria-label="File">
        <button class="seg" data-doc-file="plan" aria-pressed="true">Plan</button>
        <button class="seg" data-doc-file="review" aria-pressed="false">Review</button>
        <button class="seg" data-doc-file="test-output" aria-pressed="false">Gate output</button>
      </div>
      <div class="seg-group" role="group" aria-label="View">
        <button class="seg" data-doc-mode="read" aria-pressed="true">Read</button>
        <button class="seg" data-doc-mode="edit" aria-pressed="false">Edit</button>
        <button class="seg" data-doc-mode="diff" aria-pressed="false" title="What you changed compared with the plan the AI wrote">Changes</button>
      </div>
      <div class="doc-actions">
        <div class="seg-group" role="group" aria-label="Text size">
          <button class="seg" id="docSmaller" aria-label="Smaller text">A−</button>
          <button class="seg" id="docBigger" aria-label="Larger text">A+</button>
        </div>
        <button class="btn" id="docSave" title="Save to .pipeline/plan.md (Ctrl+S)">Save</button>
        <button class="btn" id="docClose">Close</button>
      </div>
    </header>
    <div class="doc-alert" id="docAlert" role="status" hidden></div>
    <div class="doc-body">
      <div class="doc-read" id="docRead" tabindex="0" aria-label="Document"><div class="md doc-md" id="docMd"></div></div>
      <div class="doc-edit" id="docEdit" hidden>
        <div class="doc-pane"><label class="doc-label" for="docText">Markdown source</label><textarea id="docText" spellcheck="false"></textarea></div>
        <div class="doc-pane"><div class="doc-label">Preview</div><div class="md doc-md" id="docPreview"></div></div>
      </div>
      <pre class="doc-diff" id="docDiff" tabindex="0" aria-label="Changes" hidden></pre>
    </div>
    <footer class="doc-foot" id="docFoot" hidden>
      <div class="doc-decide">
        <button class="btn primary" id="docApprove">Approve &amp; build</button>
        <button class="btn" id="docRevise" aria-controls="docNoteBox">Ask Claude for changes…</button>
        <button class="btn danger" id="docCancel">Cancel run</button>
        <span class="hint">Edits are saved to <code>.pipeline/plan.md</code>; the build reads that file.</span>
      </div>
      <div class="doc-note" id="docNoteBox" hidden>
        <label for="docNote">Describe what Claude should change in the plan (it edits the plan and shows it to you again)</label>
        <textarea id="docNote" rows="3" placeholder="e.g. Also add a --done filter, and drop the README task."></textarea>
        <button class="btn primary" id="docSendNote">Send to Claude</button>
      </div>
    </footer>
  </div>
</dialog>
<script src="/vendor/marked.min.js"></script>
<script>
const safeHref = (url) => {
  const u = String(url ?? '').trim(), probe = u.replace(/[\x00-\x20\x7f]/g, '').toLowerCase();
  return /^(javascript|vbscript|data|file):/.test(probe) ? '#' : u;
};
if (window.marked) {
  marked.use({
    gfm: true,
    renderer: {
      html({ text }) { return esc(text); },
      link({ href, title, tokens }) {
        // only web links and in-page anchors are clickable: a relative path would 404 on the dashboard's own server
        if (!/^(https?:|#)/i.test(String(href).trim())) return `<span>${this.parser.parseInline(tokens)}</span>`;
        return `<a href="${esc(safeHref(href))}"${title ? ` title="${esc(title)}"` : ''} target="_blank" rel="noopener noreferrer">${this.parser.parseInline(tokens)}</a>`;
      },
      image({ href, text }) { return `<a href="${esc(safeHref(href))}" target="_blank" rel="noopener noreferrer">[image: ${esc(text || href)}]</a>`; },
      code({ text }) { return `<pre><code>${esc(text)}</code></pre>`; },
    },
  });
}
function renderMarkdown(text) {
  return marked.parse(text).replace(/VERDICT:\s*(PASS|FAIL)/g, (m, v) => `<span class="verdict s-${v === 'PASS' ? 'done' : 'failed'}">VERDICT: ${v}</span>`);
}
const inlineMarkdown = (text) => window.marked ? marked.parseInline(text) : esc(text);
const STAGES = [['plan', 'Plan'], ['build', 'Build'], ['test', 'Gates'], ['review', 'Review'], ['commit', 'Commit']];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$' + (n || 0).toFixed((n || 0) >= 10 ? 1 : 3);
const dur = (s) => s == null ? '—' : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
const since = (iso) => iso ? Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)) : null;
const clock = (t) => new Date(t).toLocaleTimeString([], { hour12: false });
const when = (iso) => {
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })
    : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
};

let runs = [], projects = [], filter = 'all';
const hashOf = (re) => (location.hash.match(re) || [])[1];
// selected is a run id, or 'p:<id>' for a project's SPEC.md / ROADMAP.md (link: #project=<id>)
let selected = hashOf(/run=([\w.-]+)/) || (hashOf(/project=(\w+)/) ? 'p:' + hashOf(/project=(\w+)/) : null);
let projTab = selected?.startsWith('p:') && hashOf(/doc=(spec|roadmap)/) || 'spec', projShown = ''; // #project=<id>&doc=roadmap opens that document
let listSig = '', summarySig = '', shellFor = null, nextEvent = 0, follow = true, tab = 'activity';
const hashParams = new URLSearchParams(location.hash.slice(1));
let pendingDoc = hashParams.get('doc') && !selected?.startsWith('p:') ? { file: hashParams.get('doc'), mode: hashParams.get('mode') || 'read' } : null;

const live = (r) => r.state === 'running';
const elapsedOf = (r) => live(r) ? null : r.state === 'stopped' ? undefined : Math.round((Date.parse(r.updatedAt) - Date.parse(r.startedAt)) / 1000);
// Ticking clocks are spans with data-since; updateClocks() rewrites only their text, so nothing else re-renders.
const clockSpan = (iso) => `<span data-since="${esc(iso)}">${dur(since(iso))}</span>`;

function stageState(r, key) {
  if (key === 'test') { // the quality gates (older records call them tests)
    const last = r.tests[r.tests.length - 1];
    if (live(r) && r.currentStep === 'gates') return 'running';
    if (!last) return 'pending';
    return last.pass ? 'done' : 'failed';
  }
  const st = r.steps[key].state;
  return st === 'running' && !live(r) ? 'failed' : st;
}
const label = (r) => live(r) && r.currentStep ? r.currentStep : r.state;
// Quality gates of the latest round: one row per gate. Colour is never the only signal: the result word is always shown.
const G_STATE = { pass: 'done', fail: 'failed', timeout: 'failed', error: 'failed', warn: 'paused', skip: 'skipped' };
const G_WORD = { pass: 'pass', fail: 'FAIL', timeout: 'TIMEOUT', error: 'error', warn: 'warning', skip: 'skipped' };
function gateSummary(r) { // "5/7 pass" for the last round
  const g = r.gates?.[r.gates.length - 1];
  if (!g) return r.tests.length ? `${r.tests.filter((t) => t.pass).length}/${r.tests.length} pass` : '';
  const ran = g.results.filter((x) => x.status !== 'skip');
  return `${ran.filter((x) => x.status === 'pass').length}/${ran.length} pass`;
}
function gatesPanel(r) {
  const rounds = r.gates || [];
  if (!rounds.length) return '';
  const last = rounds[rounds.length - 1];
  const hist = rounds.length > 1 ? `<div class="acs">${rounds.map((g) => {
    const bad = g.results.filter((x) => x.blocking && (x.status === 'fail' || x.status === 'timeout')).length;
    return `Round ${g.round}: ${bad ? `${bad} blocking failure${bad === 1 ? '' : 's'}` : 'all clear'}`;
  }).join(' → ')}</div>` : '';
  const unproven = (x) => x.verified === false && x.status !== 'skip'; // ⓘ: a documented command that has not been verified yet
  return `<div class="sec">Quality gates<small>round ${last.round}${last.results.some(unproven) ? ' · ⓘ documented command, not yet verified' : ''}</small></div>${hist}
    <div class="tw"><table><thead><tr><th>Gate</th><th>Result</th><th>Time</th><th>Detail</th></tr></thead><tbody>${last.results.map((x) => `<tr>
      <td title="${esc(x.cmd || 'built in')}">${esc(x.id)}${x.blocking ? '' : '<span class="adv">advisory</span>'}${unproven(x) ? ' ⓘ' : ''}</td>
      <td><span class="state s-${G_STATE[x.status] || 'pending'}">${esc(G_WORD[x.status] || x.status)}</span></td>
      <td class="n">${x.status === 'skip' ? '' : x.ms < 1000 ? '&lt;1s' : dur(Math.round(x.ms / 1000))}</td>
      <td class="detail">${esc(x.note || x.cmd || '')}</td></tr>`).join('')}</tbody></table></div>`;
}

// ---- sidebar ---------------------------------------------------------------
function renderList() {
  const shown = runs.filter((r) => filter === 'all' || (filter === 'running' ? live(r) : ['failed', 'stopped'].includes(r.state)));
  const sig = JSON.stringify([filter, selected, shown, projects]);
  if (sig === listSig) return;
  listSig = sig;
  const el = $('list'), top = el.scrollTop;
  const docs = projects.length ? '<div class="proj"><span>Documents</span></div>' + projects.map((p) => `<button class="run" data-project="${esc(p.id)}" aria-current="${'p:' + p.id === selected}">
    <div class="top"><span class="name">${esc(p.name)}</span><span class="state s-done">${Object.keys(p.docs).filter((k) => p.docs[k]).map((k) => k.toUpperCase()).join(' · ')}</span></div></button>`).join('') : '';
  if (!shown.length) { el.innerHTML = docs + `<div class="empty">${runs.length ? 'No runs match this filter.' : 'No runs yet.'}</div>`; return; }
  const byProject = {};
  for (const r of shown) (byProject[r.cwd] ||= []).push(r);
  el.innerHTML = docs + Object.values(byProject).map((rs) => {
    const all = runs.filter((r) => r.cwd === rs[0].cwd);
    return `<div class="proj"><span>${esc(rs[0].project)}</span>${all.some((r) => !live(r))
      ? `<button class="btn danger" data-clear="${esc(rs[0].cwd)}" aria-label="Delete finished runs of ${esc(rs[0].project)}">Clear finished</button>` : ''}</div>`
    + rs.map((r) => {
      const e = elapsedOf(r);
      return `<button class="run" data-id="${esc(r.id)}" aria-current="${r.id === selected}">
        <div class="top"><span class="name">${esc(r.milestone ? `${r.milestone} · ` : '')}${esc(r.branch || '')}</span>
          <span class="state s-${r.state}">${esc(label(r))}</span></div>
        ${r.task ? `<div class="sub">${esc(r.task)}</div>` : ''}
        <div class="meta">${when(r.startedAt)} · ${live(r) ? clockSpan(r.startedAt) : e === undefined ? 'killed' : dur(e)} · ${money(r.totalCostUsd)}</div>
      </button>`;
    }).join('');
  }).join('');
  el.scrollTop = top;
}

// ---- detail: a fixed shell (summary + tabs), built once per selected run ------
function buildShell(r) {
  shellFor = r.id; summarySig = ''; nextEvent = 0; follow = true;
  $('detail').innerHTML = `<div id="summary"></div>
    <div class="panel">
      <div class="tabs" role="tablist" aria-label="Run details">
        <button class="tab" role="tab" data-tab="activity">Activity</button>
        <button class="tab" role="tab" data-tab="plan">plan.md</button>
        <button class="tab" role="tab" data-tab="review">review.md</button>
        <button class="tab" role="tab" data-tab="test-output">Gate output</button>
        <div class="tools" id="feedTools">
          <select id="stepFilter" aria-label="Show steps"><option value="">All steps</option>
            <option>plan</option><option>build</option><option>gates</option><option>review</option><option>commit</option></select>
          <label><input type="checkbox" id="follow" checked> Follow</label>
        </div>
        <div class="tools" id="fileTools" hidden><label><input type="checkbox" id="raw"> Raw</label><button class="btn" id="reload">Reload</button>
          <button class="btn" id="expand" title="Read (and edit) this file full screen">Full screen</button></div>
      </div>
      <div class="pane feed" id="feed" role="tabpanel" aria-label="Activity"></div>
      <div class="pane" id="filePane" role="tabpanel" hidden><div class="md" id="fileMd"></div><pre class="file" id="fileText" hidden></pre></div>
    </div>`;
  $('feed').addEventListener('scroll', () => {
    const f = $('feed'), atEnd = f.scrollHeight - f.scrollTop - f.clientHeight < 24;
    if (follow !== atEnd) { follow = atEnd; $('follow').checked = atEnd; }
  });
  $('follow').addEventListener('change', (e) => { follow = e.target.checked; if (follow) $('feed').scrollTop = $('feed').scrollHeight; });
  $('stepFilter').addEventListener('change', (e) => {
    if (e.target.value) $('feed').dataset.step = e.target.value; else delete $('feed').dataset.step;
  });
  $('reload').addEventListener('click', () => showTab(tab));
  $('raw').addEventListener('change', () => showTab(tab));
  $('expand').addEventListener('click', () => openDoc(shellFor, tab));
  showTab(tab);
}

async function showTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  const isFeed = name === 'activity';
  $('feed').hidden = !isFeed; $('filePane').hidden = isFeed;
  $('feedTools').hidden = !isFeed; $('fileTools').hidden = isFeed;
  if (isFeed) return;
  const md = $('fileMd'), pre = $('fileText');
  md.innerHTML = '<div class="muted-note">Loading…</div>'; md.hidden = false; pre.hidden = true;
  const res = await fetch(`/api/runs/${shellFor}/file/${name}`).catch(() => null);
  const text = res ? await res.text() : '';
  if (tab !== name) return;
  if (!res || !res.ok) { md.innerHTML = `<div class="muted-note">${res ? 'This file has not been written yet.' : 'Could not load the file.'}</div>`; return; }
  // Markdown files render (unless Raw is ticked); test output and raw view stay plain text.
  const asMarkdown = name !== 'test-output' && !$('raw').checked && window.marked;
  md.hidden = !asMarkdown; pre.hidden = !!asMarkdown;
  if (asMarkdown) md.innerHTML = renderMarkdown(text); else pre.textContent = text;
}

function renderSummary(r) {
  const sig = JSON.stringify(r);
  if (sig === summarySig) return;
  summarySig = sig;
  const budget = Object.values(r.steps).reduce((a, s) => a + (s.budgetUsd || 0), 0);
  const pct = budget ? Math.min(100, (r.totalCostUsd / budget) * 100) : 0;
  const e = elapsedOf(r), lastReview = r.reviews[r.reviews.length - 1];
  const pane = $('detail'), top = pane.scrollTop, winTop = window.scrollY;
  queueMicrotask(() => { pane.scrollTop = top; if (window.scrollY !== winTop) window.scrollTo(0, winTop); });
  $('summary').innerHTML = `
    <div class="head"><div><h2>${esc(r.project)}${r.milestone ? ` · ${esc(r.milestone)}` : ''}</h2>
      <div class="where">${esc(r.cwd)} · ${esc(r.branch)}${r.from !== 'plan' ? ` · resumed from ${esc(r.from)}` : ''}</div></div>
      <button class="btn danger" data-del="${esc(r.id)}" ${live(r) ? 'disabled title="A running pipeline cannot be deleted"' : ''}>Delete run</button></div>
    ${r.task ? `<details class="task"><summary title="Show the whole task">${esc(r.task)}</summary></details>` : ''}
    ${r.state === 'paused' ? reviewBanner(r) : r.message && !live(r) ? `<div class="note s-${r.state}">${esc(r.message)}</div>` : ''}
    ${r.planEdited ? '<div class="acs">You edited the plan before this build; the edited plan is what was built. Open plan.md, then “Changes” to see what you changed.</div>' : ''}
    <div class="track" role="list" aria-label="Steps">${STAGES.map(([k, l]) => {
      const s = stageState(r, k), step = r.steps[k];
      const sub = k === 'test' ? gateSummary(r)
        : step.state === 'running' && live(r) ? clockSpan(step.startedAt) : step.seconds ? dur(step.seconds) : '';
      return `<div class="stage ${s}" role="listitem" aria-label="${l}: ${s}"><div class="node" aria-hidden="true">${s === 'done' ? '✓' : s === 'failed' ? '✕' : s === 'running' ? '•' : ''}</div>
        <div class="lbl">${l}</div><div class="sm">${k === 'test' ? esc(sub) : sub}</div></div>`;
    }).join('')}</div>
    <div class="stats">
      <div class="stat"><div class="k">Status</div><div class="v"><span class="state s-${r.state}">${esc(live(r) && r.currentStep ? `running · ${r.currentStep}` : r.state)}</span></div></div>
      <div class="stat"><div class="k">Elapsed</div><div class="v">${live(r) ? clockSpan(r.startedAt) : e === undefined ? '—' : dur(e)}</div></div>
      <div class="stat"><div class="k">Fix round</div><div class="v">${r.round || 0} <small>/ ${r.maxFixLoops + 1}</small></div></div>
      <div class="stat"><div class="k">Cost / cap</div><div class="v">${money(r.totalCostUsd)} <small>/ ${money(budget)}</small></div>
        <div class="bar ${pct > 80 ? 'hot' : ''}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Budget used"><i style="width:${pct}%"></i></div></div>
    </div>
    ${r.acs?.length ? `<div class="acs">Acceptance criteria: ${r.acs.map(esc).join(', ')}</div>` : ''}
    <div class="tw"><table><thead><tr><th>Step</th><th>Model</th><th>State</th><th>Runs</th><th>Time</th><th>Cost / cap</th></tr></thead><tbody>
    ${['plan', 'build', 'review', 'commit'].map((k) => {
      const s = r.steps[k], st = s.state === 'running' && !live(r) ? r.state : s.state;
      return `<tr><td>${k}</td><td>${esc(s.model)}</td><td><span class="state s-${st}">${esc(st)}</span></td>
        <td class="n">${s.runs}</td><td class="n">${s.state === 'running' && live(r) ? clockSpan(s.startedAt) : s.seconds ? dur(s.seconds) : ''}</td>
        <td class="n">${money(s.costUsd)} / ${money(s.budgetUsd)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    ${gatesPanel(r)}
    ${lastReview && !lastReview.pass && lastReview.critical.length ? `<div class="crit"><b>Critical review findings (round ${lastReview.round})</b>
      <ul>${lastReview.critical.map((c) => `<li>${inlineMarkdown(c.replace(/^\s*(?:[-*]|\d+\.)\s*/, ''))}</li>`).join('')}</ul></div>` : ''}`;
}

// A project's documents (SPEC.md, ROADMAP.md): read live and rendered, so an edit by Claude shows up while you read.
async function renderProject(pid) {
  const p = projects.find((x) => x.id === pid);
  if (!p) { shellFor = null; $('detail').innerHTML = '<div class="empty">This project has no SPEC.md or ROADMAP.md yet.</div>'; return; }
  if (shellFor !== selected) {
    shellFor = selected; projShown = '';
    $('detail').innerHTML = `<div class="panel"><div class="tabs" role="tablist" aria-label="Project documents">
        <button class="tab" role="tab" data-ptab="spec">SPEC.md</button><button class="tab" role="tab" data-ptab="roadmap">ROADMAP.md</button>
        <span class="path">${esc(p.name)} · ${esc(p.cwd)}</span></div>
      <div class="pane" style="height: calc(100vh - 190px)"><div class="md" id="projMd"></div></div></div>`;
  }
  document.querySelectorAll('[data-ptab]').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.ptab === projTab)));
  const res = await fetch(`/api/projects/${pid}/file/${projTab}`).catch(() => null);
  const text = res && res.ok ? await res.text() : null;
  if (shellFor !== selected || !$('projMd')) return;
  const sig = projTab + '\n' + text;
  if (sig === projShown) return;                                  // unchanged: keep the reader's scroll position
  projShown = sig;
  $('projMd').innerHTML = text == null ? `<div class="muted-note">${DOCNAME[projTab]} has not been written yet.</div>` : renderMarkdown(text);
}
const DOCNAME = { spec: 'SPEC.md', roadmap: 'ROADMAP.md' };

function renderDetail() {
  if (selected?.startsWith('p:')) return renderProject(selected.slice(2));
  const r = runs.find((x) => x.id === selected);
  if (!r) { shellFor = null; $('detail').innerHTML = `<div class="empty">${runs.length ? 'Select a run.' : 'No runs yet. Start one with <code>/setup-pipeline</code>.'}</div>`; return; }
  if (shellFor !== r.id) buildShell(r);
  renderSummary(r);
}

async function loadEvents() {
  if (!shellFor || shellFor.startsWith('p:')) return;
  const id = shellFor;
  const res = await fetch(`/api/runs/${id}/events?after=${nextEvent}`).then((x) => x.json()).catch(() => null);
  if (!res || id !== shellFor || !res.events.length) return;
  nextEvent = res.next;
  const feed = $('feed');
  feed.insertAdjacentHTML('beforeend', res.events.map((e) =>
    `<div class="ev k-${esc(e.kind)}" data-step="${esc(e.step || '')}"><span class="t">${clock(e.t)}</span><span class="st">${esc(e.step || '')}</span><span class="x">${esc(e.text)}</span></div>`).join(''));
  if (follow) feed.scrollTop = feed.scrollHeight;
}

function updateClocks() {
  document.querySelectorAll('[data-since]').forEach((s) => { s.textContent = dur(since(s.dataset.since)); });
}

async function tick() {
  try {
    runs = await fetch('/api/runs').then((x) => x.json());
    projects = await fetch('/api/projects').then((x) => x.json()).catch(() => projects);
    $('dot').classList.remove('off'); $('live').textContent = 'live';
  } catch {
    $('dot').classList.add('off'); $('live').textContent = 'dashboard stopped';
    return;
  }
  const running = runs.filter(live).length;
  $('counts').textContent = `${runs.length} run${runs.length === 1 ? '' : 's'}${running ? ` · ${running} running` : ''}`;
  if (!selected) selected = runs[0]?.id || (projects[0] ? 'p:' + projects[0].id : null);
  // Each part renders on its own, and only when its data changed, so scroll positions are never reset.
  for (const part of [renderList, renderDetail, loadEvents, syncDoc]) {
    try { await part(); } catch (e) { console.error('dashboard render', e); }
  }
  if (pendingDoc && runs.some((r) => r.id === selected)) { // a link like #run=<id>&doc=plan&mode=edit opens the full-screen view
    const p = pendingDoc; pendingDoc = null;
    await openDoc(selected, p.file, p.mode);
  }
}

async function del(url, question) {
  if (!confirm(question)) return;
  const res = await fetch(url, { method: 'DELETE' }).catch(() => null);
  if (!res || !res.ok) { alert('Could not delete (it may still be running).'); return; }
  selected = null; history.replaceState(null, '', location.pathname);
  await tick();
}

document.addEventListener('click', (e) => {
  const ln = e.target.closest('[data-line]');
  if (ln) return gotoLine(Number(ln.dataset.line));
  const dd = e.target.closest('[data-doc]');
  if (dd) return openDoc(selected, dd.dataset.doc, dd.dataset.mode || 'read');
  if (e.target.closest('[data-approve]')) return decide(selected, 'approve');
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    navigator.clipboard.writeText(cp.dataset.copy).then(() => { cp.textContent = 'Copied'; }, () => { cp.textContent = 'Copy failed'; });
    return;
  }
  const d = e.target.closest('[data-del]');
  if (d) return del(`/api/runs/${d.dataset.del}`, 'Delete this pipeline run from the dashboard? Your project files are not touched.');
  const c = e.target.closest('[data-clear]');
  if (c) return del(`/api/runs?cwd=${encodeURIComponent(c.dataset.clear)}`, 'Delete every finished run of this project from the dashboard? Running ones are kept. Your project files are not touched.');
  const f = e.target.closest('[data-filter]');
  if (f) {
    filter = f.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === f)));
    return renderList();
  }
  const t = e.target.closest('[data-tab]');
  if (t) return showTab(t.dataset.tab);
  const pt = e.target.closest('[data-ptab]');
  if (pt) { projTab = pt.dataset.ptab; return renderDetail(); }
  const run = e.target.closest('.run');
  if (run) {
    selected = run.dataset.project ? 'p:' + run.dataset.project : run.dataset.id;
    history.replaceState(null, '', run.dataset.project ? `#project=${run.dataset.project}` : `#run=${selected}`);
    renderList(); renderDetail(); loadEvents();
  }
});

// ---- plan review banner (paused runs) ---------------------------------------------------------
function reviewBanner(r) {
  if (!r.editable) return '<div class="note s-paused">This plan was never approved, and a newer run of this project exists.</div>';
  const cmd = r.resumeCmd ? `<details><summary>Continue without a Claude session</summary><p>After saving your edits, run this in a terminal:</p>
    <code>${esc(r.resumeCmd)}</code> <button class="btn" data-copy="${esc(r.resumeCmd)}">Copy</button></details>` : '';
  const status = r.decision ? `Decision sent (${esc(r.decision.action)}). ${r.waiting ? 'Your Claude session will pick it up.' : 'No Claude session is waiting for it yet.'}`
    : r.waiting ? 'Your Claude session is waiting for your decision.'
    : r.lastDecision ? `Claude picked up your “${esc(r.lastDecision.action)}”.`
    : 'No Claude session is waiting here: after approving, continue with the command below.';
  const pl = r.planLint, check = !pl ? '' : pl.errors
    ? `<div class="st bad">Plan check: ${pl.errors} problem${pl.errors === 1 ? '' : 's'} to fix before building (listed in the editor).</div>`
    : `<div class="st">Plan check passed${pl.warnings ? ` · ${pl.warnings} warning${pl.warnings === 1 ? '' : 's'}` : ''}.</div>`;
  return `<div class="banner" role="region" aria-label="Plan review">
    <div><strong>Plan ready for your review</strong>
      <p>Read it full screen, change anything you like, or ask Claude for changes. Only what you approve is built.</p>
      ${check}<div class="st">${status}</div>${cmd}</div>
    <div class="banner-actions"><button class="btn primary" data-doc="plan" data-mode="edit">Review &amp; edit plan</button>
      <button class="btn" data-doc="plan" data-mode="read">Read full screen</button>
      <button class="btn" data-approve>Approve &amp; build</button></div></div>`;
}

// ---- full-screen reader / editor ---------------------------------------------------------------
const DOC_FILES = { plan: 'plan.md', review: 'review.md', 'test-output': 'Gate output' };
const doc = { runId: null, file: 'plan', mode: 'read', text: '', saved: '', found: false, notice: null, savedAt: null, diffHtml: '', lint: null };
const docRun = () => runs.find((x) => x.id === doc.runId);
const dirty = () => $('doc').open && doc.text !== doc.saved;
const discardOk = () => (!dirty() && !$('docNote').value.trim()) || confirm('Discard your unsaved changes (plan edits or a note you have not sent)?');
const mdHtml = (t) => window.marked ? renderMarkdown(t) : `<pre class="file">${esc(t)}</pre>`;
const canEditPlan = () => { const r = docRun(); return !!(r && r.state === 'paused' && r.editable && doc.file === 'plan'); };
let docFs = 16, previewTimer = 0, alertSig = '';
try { docFs = Number(localStorage.getItem('docFs')) || 16; } catch {}
function setDocFs(n) {
  docFs = Math.max(13, Math.min(24, n)); $('doc').style.setProperty('--doc-fs', `${docFs}px`);
  try { localStorage.setItem('docFs', String(docFs)); } catch {}
}
function alertBox(kind, html) {
  if (kind + html === alertSig) return; // unchanged: leave the DOM alone so buttons inside keep focus
  alertSig = kind + html;
  const a = $('docAlert'); a.hidden = !html; a.className = `doc-alert ${kind}`; a.innerHTML = html;
}
// The plan check (planlint.mjs, run by the server on the text in the editor): what the builder would trip over.
const lintItem = (x) => `<li>${x.line ? `<button class="lint-line" data-line="${x.line}" title="Jump to this line">line ${x.line}</button> ` : ''}${esc(x.msg)}</li>`;
function refreshAlert() {
  if (doc.notice) return alertBox(doc.notice.kind, doc.notice.html);
  if (doc.mode === 'diff' && dirty()) return alertBox('warn', 'This shows what is saved. Save first to include your latest edits.');
  const errs = doc.lint?.errors || [], warns = doc.lint?.warnings || [];
  if (errs.length) return alertBox('bad', `<b>Plan check: ${errs.length} problem${errs.length === 1 ? '' : 's'}</b><ul class="lint">${errs.slice(0, 6).map(lintItem).join('')}</ul>${errs.length > 6 ? `…and ${errs.length - 6} more. ` : ''}The builder follows the plan literally, so fix these first (you can still approve as it is).`);
  if (warns.length) return alertBox('warn', `<b>Plan check: ${warns.length} warning${warns.length === 1 ? '' : 's'}</b><ul class="lint">${warns.slice(0, 4).map(lintItem).join('')}</ul>${warns.length > 4 ? `…and ${warns.length - 4} more.` : ''}`);
  alertBox('', '');
}
let lintTimer = 0, lintSeq = 0;
async function loadLint() { // only for a plan that is still waiting for review
  const seq = ++lintSeq;
  if (!canEditPlan()) { doc.lint = null; return refreshAlert(); }
  const res = await fetch(`/api/runs/${doc.runId}/lint`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: doc.text }).then((x) => (x.ok ? x.json() : null)).catch(() => null);
  if (seq !== lintSeq) return; // a newer check superseded this one
  doc.lint = res; refreshAlert();
}
function gotoLine(n) { // select that line in the editor
  if (doc.mode !== 'edit') { if (canEditPlan()) setDocMode('edit').then(() => gotoLine(n)); return; }
  const ta = $('docText'), lines = ta.value.split('\n');
  let start = 0; for (let i = 0; i < n - 1 && i < lines.length; i++) start += lines[i].length + 1;
  ta.focus(); ta.setSelectionRange(start, start + (lines[n - 1] || '').length);
  ta.scrollTop = Math.max(0, (n - 3) * (parseFloat(getComputedStyle(ta).lineHeight) || 22));
}
function paintDoc() {
  $('docRead').hidden = doc.mode !== 'read'; $('docEdit').hidden = doc.mode !== 'edit'; $('docDiff').hidden = doc.mode !== 'diff';
  document.querySelectorAll('[data-doc-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.docMode === doc.mode)));
  document.querySelectorAll('[data-doc-file]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.docFile === doc.file)));
  $('docTitle').textContent = DOC_FILES[doc.file];
  if (doc.mode === 'read') {
    $('docMd').innerHTML = !doc.found ? '<div class="muted-note">This file has not been written yet.</div>'
      : doc.file === 'test-output' ? `<pre class="file">${esc(doc.text)}</pre>` : mdHtml(doc.text);
  } else if (doc.mode === 'edit') {
    if ($('docText').value !== doc.text) $('docText').value = doc.text;
    $('docPreview').innerHTML = mdHtml(doc.text);
  } else $('docDiff').innerHTML = doc.diffHtml;
}
async function loadDoc(file) {
  doc.file = file; doc.notice = null; doc.lint = null;
  const res = await fetch(`/api/runs/${doc.runId}/file/${file}`).catch(() => null);
  doc.found = !!(res && res.ok);
  doc.text = doc.found ? await res.text() : ''; doc.saved = doc.text;
}
async function loadDiff() {
  const res = await fetch(`/api/runs/${doc.runId}/plandiff`).then((x) => x.json()).catch(() => null);
  const d = res ? res.diff : null;
  doc.diffHtml = d == null ? '<div class="muted-note">There is no original plan to compare with.</div>'
    : d === '' ? '<div class="muted-note">No changes: this is the plan exactly as the AI wrote it.</div>'
    : d.split('\n').map((l) => `<span class="dl ${l[0] === '+' ? 'dl-add' : l[0] === '-' ? 'dl-del' : l[0] === '@' ? 'dl-hunk' : ''}">${esc(l)}</span>`).join('');
}
async function setDocMode(mode) {
  doc.notice = null;
  if (!['read', 'edit', 'diff'].includes(mode) || (mode === 'edit' && !canEditPlan()) || (mode === 'diff' && doc.file !== 'plan')) mode = 'read';
  doc.mode = mode;
  if (mode === 'diff') await loadDiff();
  paintDoc(); syncDoc();
  requestAnimationFrame(() => $({ read: 'docRead', edit: 'docText', diff: 'docDiff' }[mode]).focus());
  history.replaceState(null, '', `#run=${doc.runId}&doc=${doc.file}${mode === 'read' ? '' : `&mode=${mode}`}`);
}
async function openDoc(runId, file = 'plan', mode = 'read') {
  if (!runs.some((r) => r.id === runId)) return;
  doc.runId = runId; doc.savedAt = null;
  if (!$('doc').open) { $('doc').showModal(); setDocFs(docFs); }
  await loadDoc(DOC_FILES[file] ? file : 'plan');
  await setDocMode(mode);
  loadLint();
}
async function switchDocFile(file) {
  if (file === doc.file || !discardOk()) return;
  await loadDoc(file); await setDocMode('read');
  loadLint();
}
async function saveDoc() {
  if (!canEditPlan()) return false;
  const res = await fetch(`/api/runs/${doc.runId}/file/plan`, { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: doc.text }).catch(() => null);
  const body = res ? await res.json().catch(() => ({})) : {};
  if (!res || !res.ok) { doc.notice = { kind: 'bad', html: esc(body.error || 'Could not save the plan.') }; refreshAlert(); return false; }
  doc.saved = doc.text; doc.savedAt = Date.now(); doc.notice = null; doc.lint = body.lint || doc.lint; syncDoc();
  return true;
}
// Sends the decision to the local server; a Claude session (CLI, desktop, IDE) waiting on it is woken and continues.
async function decide(runId, action, note = '') {
  const inDoc = $('doc').open && runId === doc.runId;
  if (inDoc && action !== 'cancel' && dirty() && !(await saveDoc())) return false;
  const res = await fetch(`/api/runs/${runId}/decision`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, note }) }).catch(() => null);
  const body = res ? await res.json().catch(() => ({})) : {};
  if (!res || !res.ok) {
    const msg = body.error || 'Could not send the decision.';
    if (inDoc) { doc.notice = { kind: 'bad', html: esc(msg) }; refreshAlert(); } else alert(msg);
    return false;
  }
  if (inDoc) {
    const cmd = runs.find((r) => r.id === runId)?.resumeCmd;
    const sent = { approve: 'Approved.', revise: 'Sent.', cancel: 'Cancelled.' }[action];
    doc.notice = body.waiting
      ? { kind: 'ok', html: `${sent} ${{ approve: 'Your Claude session will start the build now.', revise: 'Claude will revise the plan and show it to you again.', cancel: 'Claude will stop this run.' }[action]}` }
      : { kind: 'warn', html: `${sent} No Claude session is waiting for it, so nothing starts by itself.${action === 'approve' && cmd
        ? ` To build now, run this in a terminal: <code>${esc(cmd)}</code> <button class="btn" data-copy="${esc(cmd)}">Copy</button>` : ' Tell your Claude session to check the plan review.'}` };
    refreshAlert();
  }
  await tick();
  return true;
}
function syncDoc() {
  if (!$('doc').open) return;
  const r = docRun();
  if (!r) { $('doc').close(); return; }
  const editable = r.state === 'paused' && r.editable, isPlan = doc.file === 'plan';
  $('docFoot').hidden = !editable;
  $('docSave').hidden = !(editable && isPlan); $('docSave').disabled = !dirty();
  document.querySelector('[data-doc-mode="edit"]').disabled = !(editable && isPlan);
  document.querySelector('[data-doc-mode="diff"]').disabled = !isPlan;
  if (doc.mode === 'edit' && !(editable && isPlan)) { doc.mode = 'read'; doc.notice = { kind: 'warn', html: 'This plan is read-only now: the run has moved on.' }; paintDoc(); }
  const state = editable ? 'waiting for your review' : r.state === 'resumed' ? 'the build continued from this plan' : r.state;
  const pend = r.decision ? ` · decision sent: ${r.decision.action}, waiting for Claude` : editable && r.lastDecision ? ` · Claude picked up “${r.lastDecision.action}”` : '';
  const save = dirty() ? ' · unsaved changes' : doc.savedAt ? ` · saved ${clock(doc.savedAt)}` : '';
  const sub = `${r.project} · ${r.branch} · ${state}${pend}${save}`;
  if ($('docSub').textContent !== sub) $('docSub').textContent = sub;
  refreshAlert();
}

$('docClose').onclick = () => { if (discardOk()) $('doc').close(); };
$('docSave').onclick = saveDoc;
$('docApprove').onclick = () => decide(doc.runId, 'approve');
$('docRevise').onclick = () => { const b = $('docNoteBox'); b.hidden = !b.hidden; if (!b.hidden) $('docNote').focus(); };
$('docSendNote').onclick = async () => {
  const n = $('docNote').value.trim();
  if (!n) return $('docNote').focus();
  if (await decide(doc.runId, 'revise', n)) { $('docNote').value = ''; $('docNoteBox').hidden = true; }
};
$('docCancel').onclick = () => { if (confirm('Cancel this run? Nothing will be built from this plan.')) decide(doc.runId, 'cancel'); };
$('docText').addEventListener('input', () => {
  doc.text = $('docText').value; doc.notice = null;
  clearTimeout(previewTimer); previewTimer = setTimeout(() => { $('docPreview').innerHTML = mdHtml(doc.text); }, 150);
  clearTimeout(lintTimer); lintTimer = setTimeout(loadLint, 500);
  syncDoc();
});
document.querySelectorAll('[data-doc-mode]').forEach((b) => { b.onclick = () => setDocMode(b.dataset.docMode); });
document.querySelectorAll('[data-doc-file]').forEach((b) => { b.onclick = () => switchDocFile(b.dataset.docFile); });
$('docSmaller').onclick = () => setDocFs(docFs - 1);
$('docBigger').onclick = () => setDocFs(docFs + 1);
$('doc').addEventListener('cancel', (e) => { if (!discardOk()) e.preventDefault(); }); // Esc
$('doc').addEventListener('close', () => {
  doc.runId = null; doc.text = doc.saved = ''; doc.notice = null; doc.lint = null; lintSeq++; clearTimeout(lintTimer); alertSig = '';
  $('docNote').value = ''; $('docNoteBox').hidden = true;
  history.replaceState(null, '', selected ? `#run=${selected}` : location.pathname);
});
$('doc').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (dirty()) saveDoc(); }
  // Handle Esc ourselves: browsers only allow cancelling a dialog's own Esc handling after real user interaction,
  // and unsaved edits must never be lost to a stray key press.
  if (e.key === 'Escape' && !e.isComposing) { e.preventDefault(); if (discardOk()) $('doc').close(); }
});

tick(); setInterval(tick, 1500); setInterval(updateClocks, 1000);
</script>
</body>
</html>
